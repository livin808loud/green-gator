const pCoords=s=>{
  if(!s)return null;const clean=String(s).trim();
  if(CITIES[clean])return CITIES[clean];
  const first=clean.split(',')[0].trim();if(CITIES[first])return CITIES[first];
  const upper=clean.toUpperCase();
  for(const [key,coords] of Object.entries(CITIES)){
    if(!key.includes(','))continue;
    const [city,state]=key.split(',').map(x=>x.trim());
    const cityMatch=new RegExp('(^|[^A-Z])'+city.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^A-Z]|$)').test(upper);
    const stateMatch=new RegExp('(^|[^A-Z])'+state+'(?:\\s+\\d{5})?([^A-Z0-9]|$)').test(upper);
    if(cityMatch&&stateMatch)return coords;
  }
  return null;
};
const routeBounds=(a,b)=>{
  const lats=[a[0],b[0]],lngs=[a[1],b[1]];
  let minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs);
  const latPad=Math.max(.35,(maxLat-minLat)*.28),lngPad=Math.max(.55,(maxLng-minLng)*.28);
  minLat-=latPad;maxLat+=latPad;minLng-=lngPad;maxLng+=lngPad;
  return{minLat,maxLat,minLng,maxLng,toXY:(lat,lng)=>[18+((lng-minLng)/(maxLng-minLng))*304,18+((maxLat-lat)/(maxLat-minLat))*174]};
};

const geocodePlace=async place=>{
  const clean=String(place||'').trim();if(!clean)return null;
  const known=pCoords(clean);if(known)return{coords:known,source:'saved'};
  const cache=readGeoCache();if(cache[clean])return{coords:cache[clean],source:'cached'};
  const q=/,\s*[A-Z]{2}\b/.test(clean)?clean:clean+', USA';
  let coords=null,source='';
  try{const a=await fetchJson(osmSearchUrl(q));if(a?.[0]){coords=[parseFloat(a[0].lat),parseFloat(a[0].lon)];source='osm';}}catch{}

  cache[clean]=coords;writeGeoCache(cache);return{coords,source};
};

async function authRequest(path,body,method='POST',token=null){
  const headers={'apikey':SU_KEY,'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  const r=await fetch(SU_URL+'/auth/v1'+path,{method,headers,body:body==null?undefined:JSON.stringify(body)});
  const text=await r.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch{data={message:text};}
  if(!r.ok){
    const msg=data?.error_description||data?.msg||data?.message||data?.error||('HTTP '+r.status);
    throw new Error(msg);
  }
  return data;
}
async function refreshSession(sess){
  if(!sess?.refresh_token)return null;
  const data=await authRequest('/token?grant_type=refresh_token',{refresh_token:sess.refresh_token});
  const next={
    access_token:data.access_token,
    refresh_token:data.refresh_token||sess.refresh_token,
    expires_at:Date.now()+((data.expires_in||3600)*1000),
    token_type:data.token_type||'bearer',
    user:data.user||sess.user||null,
  };
  saveSession(next);return next;
}
async function ensureFreshSession(sess){
  if(!sess?.access_token)return null;
  // refresh 60s early
  if(sess.expires_at && Date.now()<sess.expires_at-60000)return sess;
  try{return await refreshSession(sess);}catch(e){console.warn('session refresh failed',e);saveSession(null);return null;}
}

function makeDB(url,anonKey,getAccessToken){
  const token=()=>{
    try{const t=typeof getAccessToken==='function'?getAccessToken():null;return t||anonKey;}catch{return anonKey;}
  };
  const H=(x={})=>({'apikey':anonKey,'Authorization':'Bearer '+token(),'Content-Type':'application/json',...x});
  const base=url+'/rest/v1';
  const withConflict=(p,onConflict)=>{
    if(!onConflict)return p;
    return p+(p.includes('?')?'&':'?')+'on_conflict='+encodeURIComponent(onConflict);
  };
  return{
    get:async p=>{const r=await fetch(base+'/'+p,{headers:H()});if(!r.ok)throw new Error(r.status);return r.json();},
    // u=true upsert. onConflict e.g. 'org_id' or 'org_id,key' required when PK is not the natural key.
    post:async(p,b,u=false,onConflict=null)=>{
      const ex=u?{'Prefer':'resolution=merge-duplicates,return=representation'}:{'Prefer':'return=representation'};
      const r=await fetch(base+'/'+withConflict(p,u?onConflict:null),{method:'POST',headers:H(ex),body:JSON.stringify(b)});
      if(!r.ok){const t=await r.text();throw new Error(r.status+(t?': '+t.slice(0,180):''));}
      const t=await r.text();return t?JSON.parse(t):null;
    },
    patch:async(p,b)=>{const r=await fetch(base+'/'+p,{method:'PATCH',headers:H({'Prefer':'return=minimal'}),body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);},
    del:async p=>{const r=await fetch(base+'/'+p,{method:'DELETE',headers:H()});if(!r.ok)throw new Error(r.status);},
    rpc:async(fn,args={})=>{
      const r=await fetch(url+'/rest/v1/rpc/'+fn,{method:'POST',headers:H({'Prefer':'return=representation'}),body:JSON.stringify(args)});
      if(!r.ok){const t=await r.text();throw new Error(r.status+(t?': '+t.slice(0,180):''));}
      const t=await r.text();return t?JSON.parse(t):null;
    }
  };
}

  const finishOnboard=async()=>{
    const cleanFixed=String(Math.max(0,parseFloat(tFixedMo)||2331));

    setMaintCpm(cleanCpm);setTMaintCpm(cleanCpm);

    setW(w=>({...w,mpg:cleanMpg,fp:cleanFp}));
    ss('gg-onboarded',true);setOnboarded(true);
    if(db)try{await Promise.all([

      db.post('gg_config',{key:'est_monthly_miles',value:cleanMiles},true,'org_id,key'),
      db.post('gg_config',{key:'saas_onboarded',value:'1'},true,'org_id,key'),
      db.post('gg_weekly',{ar:parseFloat(W.ar)||0,dg:parseFloat(W.dg)||0,dl:parseFloat(W.dl)||0,fs:parseFloat(W.fs)||0,mi:parseFloat(W.mi)||0,fp:parseFloat(cleanFp),mpg:parseFloat(cleanMpg),tg:parseFloat(W.tg)||5000},true,'org_id'),
    ]);}catch(e){console.warn('onboard save',e);}
    // Seed a demo load so first verdict is immediate
    if(!calcM&&!calcR){setCalcM('250');setCalcDH('40');setCalcR('750');setCalcSource('DAT');}
    setSec('dispatch');
    flash('Gator Dispatch is live — run your numbers');
  };

  if(appState==='init')return <div style={{background:'#050c06',minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,color:G}}><span className="ld" style={{width:14,height:14}}/><span style={{fontSize:14,letterSpacing:'.15em'}}>LOADING...</span></div>;
  if(appState==='auth')return <AuthScreen onAuthed={async(sess)=>{setAppState('init');await startCloud(sess);}}/>;
  if(appState==='noorg')return <NoOrgScreen session={session} db={db} onSignOut={disconnectSupa} onCreated={async()=>{setAppState('init');await startCloud(sessionRef.current||loadSession());}}/>;
  if(appState==='ready'&&!onboarded)return (
    <div style={{background:'#050c06',minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20,backgroundImage:'linear-gradient(rgba(26,53,32,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(26,53,32,.1) 1px,transparent 1px)',backgroundSize:'36px 36px'}}>
      <div style={{background:'linear-gradient(150deg,#0c1c0e,#081108)',border:`1px solid ${BD}`,borderRadius:14,padding:28,maxWidth:480,width:'100%'}}>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><span className="lbl">Maint reserve $/mi</span><input className="inp" value={tMaintCpm} onChange={e=>setTMaintCpm(e.target.value)} inputMode="decimal"/></div>
            <div><span className="lbl">Est. miles / month</span><input className="inp" value={estMilesHint} onChange={e=>setEstMilesHint(e.target.value)} inputMode="decimal"/></div>

  );

  const SH=({t,right})=><div className="sec-hd"><div className="sec-title">{t}</div>{right&&<div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>{right}</div>}</div>;

          </div>

          <div style={{padding:'16px 16px',borderRadius:10,background:cVerdict.b,border:`1px solid ${cVerdict.c}55`,marginBottom:14}}>

              <div style={{color:cVerdict.c,fontWeight:800,fontSize:32,letterSpacing:'.08em'}}>{cVerdict.t}</div>

            </div>

            {cReady&&<div style={{color:DIM,fontSize:10,marginTop:8}}>Gross ${cGrossRPM.toFixed(2)}/mi · floor ${cBreakEvenGross.toFixed(2)} · min target ${cMinimumTarget.toFixed(2)} · strong ${cStrongTarget.toFixed(2)}{calcSource==='DAT'?' · includes 2.5% + $2 invoice':''}</div>}
          </div>

          {cReady?<>
            <div className="g-auto">

              <Stat l="Overhead Share" v={'$'+cOH.toFixed(0)} c="#fbbf24" sub={'$'+ohPerMi.toFixed(2)+'/mi'}/>
              <Stat l="Operating Profit" v={'$'+cOperatingProfit.toFixed(0)} c={cOperatingProfit>=0?'#4ade80':'#f87171'} sub={'$'+cOperatingRPM.toFixed(2)+'/mi after all-in costs'}/>
            </div>
            <div style={{marginTop:14,display:'flex',gap:8,flexWrap:'wrap'}}>
              <button className="btn" style={{fontSize:11,padding:'8px 14px'}} onClick={()=>{setLogF({date:todayStr(),pickup:'',dropoff:'',miles:String(calcM||''),dh:String(calcDH||''),rpm:cTot>0?(cR/cTot).toFixed(2):'',pay:String(calcR||''),fuel:cFuel?cFuel.toFixed(0):'',comments:'From Gator Dispatch · '+(calcSource==='DAT'?'DAT/factored':'direct')});setAddLog(true);setSec('logbook');flash('Prefilled logbook from dispatch');}}>Log this load →</button>
              <button className="btn-g" style={{fontSize:11,padding:'8px 14px'}} onClick={()=>navTo('overview')}>Weekly money</button>
            </div>
          </>:<div style={{color:DIM,fontSize:12,lineHeight:1.6}}>Enter loaded miles, deadhead, and the offered rate. DAT offers auto-include factoring drag so you do not get fooled by the headline number.</div>}
        </div>

        <div className="card">
          <div style={{fontWeight:700,color:'#c8e0cc',fontSize:12,marginBottom:8}}>How verdicts work</div>
          <div style={{display:'grid',gap:8,fontSize:11,color:DIM,lineHeight:1.55}}>
            <div><b style={{color:'#4ade80'}}>TAKE</b> — at or above 1.3× break-even gross RPM (1.6× = strong).</div>

      {sec==='overview'&&<div className="section" ref={refs.overview}>
        <SH t="Money" right={showReset?<div style={{display:'flex',gap:6,alignItems:'center',padding:'6px 12px',background:'rgba(251,191,36,.07)',border:'1px solid rgba(251,191,36,.2)',borderRadius:8}}>

        <div className="g4" style={{marginBottom:12}}>
          <div className="kpi">
            <div style={{color:MUT,fontSize:9,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',marginBottom:8}}>Weekly Gross</div>
            <div className={gross>0?'gg':''} style={{fontSize:28,fontWeight:700,color:gross>0?G:'#dceede',lineHeight:1,marginBottom:8}}>${gross.toLocaleString()}</div>

            <div style={{color:MUT,fontSize:9,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',marginBottom:8}}>Net After Fuel</div>

                </div>
                <div style={{marginTop:10,padding:'10px 12px',border:'1px solid #1c3822',borderRadius:8,background:'rgba(57,255,107,.025)'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:8}}><span className="lbl" style={{margin:0}}>IFTA State Breakdown</span><span className={route.iftaStatus==='calculated'?'ifta-tag':'ifta-tag pending'}>{route.iftaStatus==='calculated'?'✓ CALCULATED':'UNTAGGED'}</span></div>
                  <div className="ifta-strip">{Object.entries(route.ifta||{}).map(([st,mi])=><span className="ifta-chip" key={st}>{st} <b>{mi} mi</b></span>)}{route.iftaStatus==='calculated'&&!Object.keys(route.ifta||{}).length&&<span style={{color:DIM,fontSize:10}}>0 reportable miles — canceled/TONU with no travel recorded.</span>}</div>
                </div>
                <div style={{marginTop:10,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                  <button className="btn-g" onClick={()=>startEditLog(route)}>Edit Selected Load</button>
                  <a href={googleRouteUrl(route)} target="_blank" rel="noreferrer" className="btn-g" style={{textDecoration:'none'}}>Google Maps</a>
                  <span style={{color:DIM,fontSize:10}}>{route.comments||'No comments saved.'}</span>
                </div>
              </>;
            })():<div style={{color:DIM,textAlign:'center',padding:40,fontSize:11}}>Click a logbook row to view its route.</div>}
          </div>
        </div>
      </div>}

      {/* MAINTENANCE */}
      {sec==='maintenance'&&<div className="section" ref={refs.maintenance}>
        <SH t="Maintenance Log" right={<>
          {maintLog.length>0&&<span style={{color:DIM,fontSize:11}}>Total spent: <span style={{color:'#f87171',fontWeight:700}}>${maintLog.reduce((s,e)=>s+(e.cost||0),0).toLocaleString()}</span></span>}
          <button className={addMaint?'btn-g':'btn'} style={{fontSize:11,padding:'7px 14px',background:addMaint?'rgba(57,255,107,.06)':undefined,boxShadow:addMaint?'none':undefined}} onClick={()=>addMaint?resetMaintForm():setAddMaint(true)}>{addMaint?'✕ Cancel':'+ Log Service'}</button>
        </>}/>
        {serviceReminders.length>0&&<div className="card" style={{marginBottom:12,borderColor:'rgba(251,191,36,.3)',background:'linear-gradient(150deg,rgba(48,35,4,.72),#081108)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:10}}>
            <div style={{fontWeight:700,color:'#fbbf24',fontSize:12,letterSpacing:'.04em'}}>⚠ SERVICE REMINDERS</div>
            <div style={{display:'flex',alignItems:'flex-end',gap:6,flexWrap:'wrap'}}><div><span className="lbl">Current Odometer</span><input className="inp" style={{width:130,padding:'6px 9px'}} value={tOdometer} onChange={e=>setTOdometer(e.target.value)} inputMode="numeric"/></div><button className="btn-g" style={{fontSize:10,padding:'6px 10px'}} onClick={saveOdometer}>Update</button></div>
          </div>
          <div className="g12">
            {serviceReminders.map(r=>{const overdue=r.remaining<=0,soon=r.remaining>0&&r.remaining<=2000,c=overdue?'#f87171':soon?'#fbbf24':G;return <div className="stat" key={r.label} style={{borderColor:c+'55'}}>
              <div style={{color:MUT,fontSize:9,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',marginBottom:4}}>{r.label}</div>
              <div style={{color:c,fontWeight:700,fontSize:16}}>{r.due.toLocaleString()} mi</div>
              <div style={{color:c,fontSize:10,fontWeight:700,marginTop:3}}>{overdue?`${Math.abs(r.remaining).toLocaleString()} mi overdue`:`${r.remaining.toLocaleString()} mi remaining`}</div>
              <div style={{color:DIM,fontSize:9,marginTop:2}}>Last at {r.last.toLocaleString()} mi · {r.interval.toLocaleString()}-mile interval</div>
            </div>;})}
          </div>
        </div>}
        {addMaint&&<div className="card" style={{marginBottom:12}}>
          <div style={{fontWeight:700,color:'#c8e0cc',fontSize:12,marginBottom:12}}>{editingMaintId?'Edit Maintenance Entry':'New Maintenance Entry'}</div>
          <div className="maint-form-grid" style={{marginBottom:10}}>
            <div><span className="lbl">Date</span><input className="inp" type="date" value={maintF.date} onChange={e=>setMaintF({...maintF,date:e.target.value})} style={{colorScheme:'dark'}}/></div>
            <div><span className="lbl">Service Type</span><select className="inp" value={maintF.type} onChange={e=>setMaintF({...maintF,type:e.target.value})}>{MAINT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
            <div><span className="lbl">Odometer (mi)</span><input className="inp" value={maintF.mileage} onChange={e=>setMaintF({...maintF,mileage:e.target.value})} inputMode="numeric" placeholder="180,000"/></div>
            <div><span className="lbl">Cost ($)</span><input className="inp" value={maintF.cost} onChange={e=>setMaintF({...maintF,cost:e.target.value})} inputMode="decimal" placeholder="0.00"/></div>
          </div>
          <div style={{marginBottom:12}}><span className="lbl">Notes / Next Service Due</span><input className="inp" value={maintF.notes} onChange={e=>setMaintF({...maintF,notes:e.target.value})} placeholder="Next oil change at 185,000 mi · parts used..."/></div>
          <div style={{display:'flex',gap:8}}><button className="btn" onClick={doAddMaint}>{editingMaintId?'Save Changes':'Save Entry'}</button>{editingMaintId&&<button className="btn-g" onClick={resetMaintForm}>Cancel Edit</button>}</div>
        </div>}
        {maintLog.length>0?<div className="card" style={{padding:0,overflow:'hidden'}}>
          <table className="tbl">
            <thead><tr>{['DATE','SERVICE TYPE','ODOMETER','COST','NOTES',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{maintLog.map(e=><tr key={e.id}><td style={{color:DIM,fontSize:10}}>{e.date}</td><td style={{color:'#c8e0cc',fontWeight:700}}>{e.type}</td><td>{(e.mileage||0).toLocaleString()}mi</td><td style={{color:'#f87171',fontWeight:700}}>${e.cost||0}</td><td style={{color:DIM,maxWidth:180,fontSize:10}}>{e.notes}</td><td style={{whiteSpace:'nowrap'}}><button className="btn-g" style={{fontSize:10,padding:'3px 8px',marginRight:5}} onClick={()=>startEditMaint(e)}>Edit</button><button className="btn-danger" onClick={()=>delMaint(e.id)}>Del</button></td></tr>)}
            </tbody>
          </table>
        </div>:<div style={{color:DIM,fontSize:12,padding:'20px 0',textAlign:'center'}}>No maintenance entries yet.</div>}
        <div style={{height:24}}/>
      </div>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
