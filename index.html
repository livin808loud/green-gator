};

const geocodePlace=async place=>{
  const clean=String(place||'').trim();if(!clean)return null;
  const known=pCoords(clean);if(known)return{coords:known,source:'saved'};
  const cache=readGeoCache();if(cache[clean])return{coords:cache[clean],source:'cached'};
  const q=/,\s*[A-Z]{2}\b/.test(clean)?clean:clean+', USA';
  // Provider 1: OpenStreetMap Nominatim
  try{
    const r=await fetch(osmSearchUrl(q),{headers:{'Accept':'application/json'}});
    if(r.ok){const a=await r.json();if(a?.[0]){const coords=[parseFloat(a[0].lat),parseFloat(a[0].lon)];cache[clean]=coords;writeGeoCache(cache);return{coords,source:'osm'};}}
  }catch(e){}
  // Provider 2 (backup): Photon geocoder
  try{
    const r2=await fetch(photonUrl(q),{headers:{'Accept':'application/json'}});
    if(r2.ok){const a2=await r2.json();const f=a2?.features?.[0];if(f?.geometry?.coordinates){const coords=[parseFloat(f.geometry.coordinates[1]),parseFloat(f.geometry.coordinates[0])];cache[clean]=coords;writeGeoCache(cache);return{coords,source:'photon'};}}

};

function makeDB(url,key){
  const H=(x={})=>({'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json',...x});
  const base=url+'/rest/v1';
  return{
    get:async p=>{const r=await fetch(base+'/'+p,{headers:H()});if(!r.ok)throw new Error(r.status);return r.json();},
    post:async(p,b,u=false)=>{const ex=u?{'Prefer':'resolution=merge-duplicates,return=representation'}:{'Prefer':'return=representation'};const r=await fetch(base+'/'+p,{method:'POST',headers:H(ex),body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null;},
    patch:async(p,b)=>{const r=await fetch(base+'/'+p,{method:'PATCH',headers:H(),body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);},
    del:async p=>{const r=await fetch(base+'/'+p,{method:'DELETE',headers:H()});if(!r.ok)throw new Error(r.status);}
  };
}

                  <span className="sb" style={{background:'rgba(57,255,107,.07)',color:rC(nr),border:'1px solid '+BD}}>${nr.toFixed(2)}/mi net</span>
                </div>
                <div className="lc-route">{e.pickup?.split(',')[0]}<span className="route-arrow">→</span>{e.dropoff?.split(',')[0]}{e.source?<span style={{color:DIM,fontWeight:400,fontSize:10}}> · {e.source}</span>:null}</div>
                <div className="lc-stats">
                  <div><div className="lc-stat-l">Miles</div><div className="lc-stat-v" style={{color:'#dceede'}}>{tot}{(e.dh||0)>0?<span style={{color:DIM,fontSize:9,fontWeight:400}}> ({e.dh}dh)</span>:null}</div></div>
                  <div><div className="lc-stat-l">Gross</div><div className="lc-stat-v" style={{color:G}}>${Number(e.pay||0).toLocaleString()}</div></div>
                  <div><div className="lc-stat-l">Fuel</div><div className="lc-stat-v" style={{color:'#f87171'}}>${Number(e.fuel||0).toLocaleString()}</div></div>
                  <div><div className="lc-stat-l">Net</div><div className="lc-stat-v" style={{color:np>=0?G:'#f87171'}}>${np.toLocaleString()}</div></div>
                </div>
                <div style={{color:'#fbbf24',fontSize:10,marginBottom:10,lineHeight:1.5}}>Estimated fuel: <b>{fe.gallons.toFixed(1)} gal · ${fe.cost.toFixed(2)}</b> <span style={{color:DIM}}>at ${fe.price.toFixed(2)}/gal and {fe.mpg.toFixed(1)} MPG</span></div>
                {fl&&<div style={{color:'#fbbf24',fontSize:10,marginBottom:10,lineHeight:1.5}}>⚠ {fl.t==='none'?'No fuel logged — this trip usually burns ~$'+fl.est.toFixed(0)+'.':'Fuel looks '+(fl.t==='high'?'high':'low')+' — ~$'+fl.est.toFixed(0)+' is typical for these miles.'}</div>}
                <div style={{display:'flex',gap:7}}>
                  <button className="lc-btn" style={{background:'rgba(57,255,107,.07)',color:G,border:'1px solid '+BD}} onClick={()=>viewRoute(e)}>Route 🗺</button>
                  <button className="lc-btn" style={{background:'transparent',color:'#dceede',border:'1px solid #1c3822'}} onClick={()=>startEditLog(e)}>Edit</button>
                  <button className="lc-btn" style={{background:'rgba(248,113,113,.06)',color:'#f87171',border:'1px solid rgba(248,113,113,.2)',flex:'0 0 64px'}} onClick={()=>delLog(e.id)}>✕</button>
                </div>
              </div>;
            })}
          </div>
          {shownLog.length>8&&<div style={{padding:'11px 14px',borderTop:'1px solid #142818',textAlign:'center'}}>
            <button className="btn-g" style={{width:'100%',maxWidth:340}} onClick={()=>setShowAllLoads(v=>!v)}>{showAllLoads?'Show recent 8 only':'Show all '+shownLog.length+' loads ▾'}</button>
          </div>}
        </div>}
        {shownLog.length===0&&<div className="card" style={{color:DIM,fontSize:12,textAlign:'center',marginBottom:12}}>No loads found for this filter.</div>}
        <div className="card" style={{marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,flexWrap:'wrap',gap:8}}>
            <div><div style={{fontWeight:700,color:'#c8e0cc',fontSize:13}}>{comparisonTitle}</div>{isCurrentMonth&&<div style={{color:'#6f8f76',fontSize:11,lineHeight:1.45,marginTop:4}}>Apples-to-apples comparison through day {compareDay}; the rest of {prevName.split(' ')[0]} is excluded.</div>}</div>
            {M0.loads===0&&<span style={{color:DIM,fontSize:10}}>No data logged for {prevName}</span>}
          </div>
          <div style={{overflowX:'auto'}}>
            <table className="tbl">
              <thead><tr>{['METRIC',currentPeriodLabel,previousPeriodLabel,'CHANGE'].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>
                {(()=>{
                  const money=v=>'$'+(Math.round(v*100)/100).toLocaleString();
                  const rows=[
                    {l:'Gross Revenue',a:M1.gross,b:M0.gross,f:money},
                    {l:'Number of Loads',a:M1.loads,b:M0.loads,f:v=>String(v)},
                    {l:'Total Miles',a:M1.miles,b:M0.miles,f:v=>v.toLocaleString()+' mi'},
                    {l:'Avg Rate / Mile (net)',a:M1.rpm,b:M0.rpm,f:v=>'$'+v.toFixed(2)},
                    {l:'Fuel Spend (logged)',a:M1.fuel,b:M0.fuel,f:money,inv:true},
                    {l:'Net After Fuel',a:M1.net,b:M0.net,f:money},
                  ];
                  return rows.map(({l,a,b,f,inv})=>{
                    const diff=a-b;
                    const pctCh=b!==0?(diff/Math.abs(b))*100:null;
                    const good=inv?diff<=0:diff>=0;
                    const dc=diff===0?DIM:good?G:'#f87171';
                    const arrow=diff===0?'—':diff>0?'▲':'▼';
                    return <tr key={l}>
                      <td style={{color:'#c8e0cc',fontWeight:700,whiteSpace:'nowrap'}}>{l}</td>
                      <td style={{color:G,fontWeight:700,whiteSpace:'nowrap'}}>{f(a)}</td>
                      <td style={{color:DIM,whiteSpace:'nowrap'}}>{M0.loads===0&&b===0?'—':f(b)}</td>
                      <td style={{whiteSpace:'nowrap'}}><span style={{color:dc,fontWeight:700}}>{arrow} {f(Math.abs(diff))}</span>{pctCh!==null&&<span style={{color:dc,fontSize:9,marginLeft:6}}>({pctCh>=0?'+':''}{pctCh.toFixed(0)}%)</span>}</td>
                    </tr>;
                  });
                })()}
              </tbody>
            </table>
          </div>
        </div>

        <div className="card" style={{marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12,flexWrap:'wrap',gap:8}}>
            <div style={{fontWeight:700,color:'#c8e0cc',fontSize:13}}>State Mileage <span style={{color:DIM,fontWeight:400,fontSize:10}}>— optional / future IFTA support · {selectedWeek?'week '+weekFilterLabel:selMonth!=='all'?monthLabel(selMonth):'all loads'}</span></div>
            <button className="btn-g" style={{fontSize:10,padding:'5px 11px'}} onClick={exportIFTA}>⬇ IFTA CSV</button>
          </div>
          {Object.keys(iftaAgg.agg).length===0&&iftaAgg.un.miles===0?<div style={{color:DIM,fontSize:11}}>No miles in this filter. Tag loads with state miles (e.g. <span style={{color:G}}>GA:120, SC:80</span>) in the load form to build quarterly IFTA totals.</div>:<>
            <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:10}}>
              {Object.keys(iftaAgg.agg).sort().map(s=><span key={s} style={{background:'rgba(57,255,107,.06)',color:G,padding:'5px 12px',borderRadius:20,fontSize:11,border:'1px solid rgba(57,255,107,.18)',fontWeight:700}}>{s} <span style={{color:'#dceede'}}>{Math.round(iftaAgg.agg[s]*10)/10}mi</span></span>)}
              {iftaAgg.un.miles>0&&<span style={{background:'rgba(74,109,82,.08)',color:MUT,padding:'5px 12px',borderRadius:20,fontSize:11,border:'1px solid '+BD,fontWeight:700}}>NOT TRACKED <span>{Math.round(iftaAgg.un.miles*10)/10}mi · {iftaAgg.un.loads} loads</span></span>}
            </div>
            {(iftaAgg.un.loads>0||iftaAgg.mismatch>0)&&<div style={{color:DIM,fontSize:10,lineHeight:1.6}}>
              {iftaAgg.un.loads>0&&<span>Optional: add state mileage later by editing a load and entering <span style={{color:G}}>GA:120, SC:80</span>. </span>}
              {iftaAgg.mismatch>0&&<span>⚠ {iftaAgg.mismatch} load{iftaAgg.mismatch>1?'s':''} where state miles don't add up to total miles (±10%).</span>}
            </div>}
          </>}
        </div>
        <div className="g11 logbook-map-grid">
          <div className="card calendar-panel">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <button className="btn-g" style={{padding:'5px 11px'}} onClick={()=>setCal(cm===0?{y:cy-1,m:11}:{y:cy,m:cm-1})}>←</button>
              <span style={{color:G,fontWeight:700,fontSize:13}}>{MONTHS[cm]} {cy}</span>
              <button className="btn-g" style={{padding:'5px 11px'}} onClick={()=>setCal(cm===11?{y:cy+1,m:0}:{y:cy,m:cm+1})}>→</button>
            </div>
            <div className="calendar-scroll">
            <div className="calendar-inner">
            <div className="calendar-grid" style={{marginBottom:4}}>{DAYS.map(d=><div key={d} style={{color:DIM,fontSize:10,textAlign:'center',paddingBottom:5,fontWeight:700}}>{d}</div>)}</div>
            <div className="calendar-grid">
              {Array(fd).fill(null).map((_,i)=><div key={'e'+i}/>)}
              {Array(dim).fill(null).map((_,i)=>{const d=i+1,dl=dLogs(d),isT=d===nowD.getDate()&&cm===nowD.getMonth()&&cy===nowD.getFullYear();
                return <div key={d} className="cdv" style={{border:isT?'1px solid rgba(57,255,107,.6)':`1px solid ${dl.length?BD:'transparent'}`,background:dl.length?'rgba(57,255,107,.04)':'transparent',boxShadow:isT?'0 0 12px rgba(57,255,107,.2)':'none'}}>
                  <div style={{color:isT?G:DIM,fontSize:10,marginBottom:1,fontWeight:isT?700:400}}>{d}</div>
                  {dl.slice(0,1).map(e=><div key={e.id} className="calendar-load">{e.pickup?.split(',')[0]}→{e.dropoff?.split(',')[0]}<br/><span style={{color:G,fontWeight:700}}>${e.pay}</span></div>)}
                </div>;
              })}
            </div>
            </div>
            </div>
          </div>
          <div className={'card route-panel'+(route?' open':'')} ref={routeCardRef}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <div style={{fontWeight:700,color:'#c8e0cc',fontSize:13}}>Route Map — OpenStreetMap</div>
              {route&&<button className="btn-g route-close" style={{padding:'6px 13px',fontSize:12}} onClick={()=>setRoute(null)}>✕ Close</button>}
            </div>
            {route?(()=>{
              const routeTotalMiles=(parseFloat(route.miles)||0)+(parseFloat(route.dh)||0);
              const routeFuelEstimate=fuelEstimateForMiles(routeTotalMiles,mpg,fp);
              return <>
                <div style={{borderRadius:8,overflow:'hidden',marginBottom:8,background:'#030806',border:'1px solid #1c3822'}}>
                  {mapCoords?<div ref={mapElRef} className="route-map"/>
                  :mapFallback?<iframe title="Backup route map" className="route-map" style={{border:0,display:'block',filter:'invert(0.88) hue-rotate(180deg) saturate(0.85)'}} loading="lazy" src={'https://maps.google.com/maps?saddr='+encodeURIComponent(route.pickup||'')+'&daddr='+encodeURIComponent(route.dropoff||'')+'&output=embed'}/>
                  :<div style={{padding:28,textAlign:'center',color:DIM,fontSize:11,lineHeight:1.6}}>{mapNote||'Loading map...'}</div>}
                </div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap',marginBottom:10}}>
                  <span style={{color:DIM,fontSize:9}}>{mapCoords?'© OpenStreetMap contributors':mapFallback?'Backup map · Google':''} · {mapNote}</span>
                  <a href={googleRouteUrl(route)} target="_blank" rel="noreferrer" className="btn-g" style={{textDecoration:'none',fontSize:10,padding:'5px 11px'}}>Open in Google Maps →</a>
                </div>
                <div className="g-auto">
                  {[{l:'Total Miles',v:routeTotalMiles+'mi',s:(parseFloat(route.miles)||0)+' loaded · '+(parseFloat(route.dh)||0)+' DH'},{l:'Estimated Fuel',v:routeFuelEstimate.gallons.toFixed(1)+' gal',s:'$'+routeFuelEstimate.cost.toFixed(2)+' · $'+routeFuelEstimate.price.toFixed(2)+'/gal · '+routeFuelEstimate.mpg.toFixed(1)+' MPG',c:'#fbbf24'},{l:'Gross Pay',v:'$'+(parseFloat(route.pay)||0),s:'Actual fuel: $'+(parseFloat(route.fuel)||0),c:G},{l:'Net RPM',v:'$'+(((parseFloat(route.pay)||0)-(parseFloat(route.fuel)||0))/Math.max(1,routeTotalMiles)).toFixed(2),s:'net per all miles',c:rC(((parseFloat(route.pay)||0)-(parseFloat(route.fuel)||0))/Math.max(1,routeTotalMiles))}].map(({l,v,s,c})=><div key={l} className="stat"><div style={{color:MUT,fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',marginBottom:2}}>{l}</div><div style={{color:c||'#dceede',fontWeight:700,fontSize:13}}>{v}</div><div style={{color:DIM,fontSize:9,marginTop:2}}>{s}</div></div>)}
                </div>
                <div style={{marginTop:10,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                  <button className="btn-g" onClick={()=>startEditLog(route)}>Edit Selected Load</button>
                  <span style={{color:DIM,fontSize:10}}>{route.comments||'No comments saved.'}</span>
                </div>
              </>;
            })():<div style={{color:DIM,textAlign:'center',padding:40,fontSize:11}}>Tap a load's Route button (or click a row) to view it on the map.</div>}
          </div>
        </div>
      </div>}

      {/* MAINTENANCE */}
      {sec==='maintenance'&&<div className="section" ref={refs.maintenance}>
        <SH t="Maintenance Log" right={<>
          {maintLog.length>0&&<span style={{color:DIM,fontSize:11}}>Total spent: <span style={{color:'#f87171',fontWeight:700}}>${maintLog.reduce((s,e)=>s+(parseFloat(e.cost)||0),0).toLocaleString()}</span></span>}
          <button className={addMaint?'btn-g':'btn'} style={{fontSize:11,padding:'7px 14px',background:addMaint?'rgba(57,255,107,.06)':undefined,boxShadow:addMaint?'none':undefined}} onClick={()=>addMaint?resetMaintForm():setAddMaint(true)}>{addMaint?'✕ Cancel':'+ Log Service'}</button>
        </>}/>
        {addMaint&&<div className="card" style={{marginBottom:12}}>
          <div style={{fontWeight:700,color:'#c8e0cc',fontSize:12,marginBottom:12}}>{editingMaintId?'Edit Maintenance Entry':'New Maintenance Entry'}</div>
          <div className="maint-form-grid" style={{marginBottom:10}}>
            <div><span className="lbl">Date</span><input className="inp" type="date" value={maintF.date} onChange={e=>setMaintF({...maintF,date:e.target.value})} style={{colorScheme:'dark'}}/></div>
            <div><span className="lbl">Service Type</span><select className="inp" value={maintF.type} onChange={e=>setMaintF({...maintF,type:e.target.value})}>{MAINT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
            <div><span className="lbl">Odometer (mi)</span><input className="inp" value={maintF.mileage} onChange={e=>setMaintF({...maintF,mileage:e.target.value})} inputMode="numeric" placeholder="180,000"/></div>
            <div><span className="lbl">Cost ($)</span><input className="inp" value={maintF.cost} onChange={e=>setMaintF({...maintF,cost:e.target.value})} inputMode="decimal" placeholder="0.00"/></div>
          </div>
          <div style={{marginBottom:12}}><span className="lbl">Notes / Next Service Due</span><input className="inp" value={maintF.notes} onChange={e=>setMaintF({...maintF,notes:e.target.value})} placeholder="Next oil change at 185,000 mi · parts used..."/></div>
          <div style={{display:'flex',gap:8}}><button className="btn" onClick={doAddMaint}>{editingMaintId?'Save Changes':'Save Entry'}</button>{editingMaintId&&<button className="btn-g" onClick={resetMaintForm}>Cancel Edit</button>}</div>
        </div>}
        {maintLog.length>0?<div className="card" style={{padding:0,overflow:'hidden'}}>
          <table className="tbl">
            <thead><tr>{['DATE','SERVICE TYPE','ODOMETER','COST','NOTES',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{maintLog.map(e=><tr key={e.id}><td style={{color:DIM,fontSize:10}}>{fmtDate(e.date)}</td><td style={{color:'#c8e0cc',fontWeight:700}}>{e.type}</td><td>{(parseFloat(e.mileage)||0).toLocaleString()}mi</td><td style={{color:'#f87171',fontWeight:700}}>${e.cost||0}</td><td style={{color:DIM,maxWidth:180,fontSize:10}}>{e.notes}</td><td style={{whiteSpace:'nowrap'}}><button className="btn-g" style={{fontSize:10,padding:'3px 8px',marginRight:5}} onClick={()=>startEditMaint(e)}>Edit</button><button className="btn-danger" onClick={()=>delMaint(e.id)}>Del</button></td></tr>)}
            </tbody>
          </table>
        </div>:<div style={{color:DIM,fontSize:12,padding:'20px 0',textAlign:'center'}}>No maintenance entries yet.</div>}
        <div style={{height:24}}/>
      </div>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
