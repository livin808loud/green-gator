function makeDB(url,key){
  const H=(x={})=>({'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json',...x});
  const base=url+'/rest/v1';
  return{
    get:async p=>{const r=await fetch(base+'/'+p,{headers:H()});if(!r.ok)throw new Error(r.status);return r.json();},
    post:async(p,b,u=false)=>{const ex=u?{'Prefer':'resolution=merge-duplicates,return=representation'}:{'Prefer':'return=representation'};const r=await fetch(base+'/'+p,{method:'POST',headers:H(ex),body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null;},
    patch:async(p,b)=>{const r=await fetch(base+'/'+p,{method:'PATCH',headers:H(),body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);},
    del:async p=>{const r=await fetch(base+'/'+p,{method:'DELETE',headers:H()});if(!r.ok)throw new Error(r.status);}
  };
}

          {moLogs.length===0?<div style={{color:DIM,fontSize:12,padding:'12px 0',textAlign:'center'}}>No loads logged for {moName} yet.</div>:<>
            <div className="g-auto" style={{marginBottom:12}}>
              {[{l:'Gross',v:'$'+moGross.toLocaleString(),c:G},{l:'Fuel',v:'$'+moFuel.toLocaleString(),c:'#f87171'},{l:'Net Revenue',v:'$'+moNet.toLocaleString(),c:G},{l:'Overhead',v:'$2,331',c:'#fbbf24'},{l:'True Profit',v:'$'+moProfit.toLocaleString(),c:moProfit>=0?G:'#f87171',sub:moProfit>=0?'After all costs':'Below costs'},{l:'Miles',v:moMiles.toLocaleString()},{l:'Avg RPM',v:moMiles>0?'$'+(moNet/moMiles).toFixed(2):'—',c:moMiles>0?rC(moNet/moMiles):DIM},{l:'Loads',v:String(moLogs.length)}].map(({l,v,c,sub})=><Stat key={l} l={l} v={v} c={c} sub={sub}/>)}
            </div>
            <div className="pg"><div className="pgf" style={{width:Math.min(100,Math.max(0,(moProfit/5000)*100))+'%',background:`linear-gradient(90deg,${moProfit>=0?G:'#f87171'}88,${moProfit>=0?G:'#f87171'})`}}/></div>
          </>}
        </div>

        {weekHistory.length>0&&<div className="card">
          <div style={{fontWeight:700,color:'#c8e0cc',fontSize:12,marginBottom:12}}>Past Weeks</div>
          <div style={{overflowX:'auto'}}>
            <table className="tbl">
              <thead><tr>{['WEEK END','GROSS','NET','LOADS','MILES'].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>{weekHistory.map(w=><tr key={w.id}><td style={{color:DIM,fontSize:10}}>{w.weekEnd}</td><td style={{color:G,fontWeight:700}}>${(parseFloat(w.gross)||0).toLocaleString()}</td><td style={{color:parseFloat(w.net)>=0?G:'#f87171',fontWeight:700}}>${(parseFloat(w.net)||0).toFixed(0)}</td><td>{w.loads||0}</td><td>{(parseFloat(w.mi)||0).toLocaleString()}mi</td></tr>)}</tbody>
            </table>
          </div>
        </div>}
      </div>}

      {/* PIPELINE */}
      {sec==='pipeline'&&<div className="section" ref={refs.pipeline}>
        <SH t="Lead Pipeline" right={<>
          <span style={{color:DIM,fontSize:11}}>{leads.filter(l=>l.status==='Active customer').length} active · {leads.filter(l=>l.status==='Called - Interested').length} interested</span>
          <span style={{color:DIM,fontSize:11}}>{leads.filter(l=>l.status!=='Not called'&&l.status!=='Called - Not interested').length}/{leads.length} engaged</span>
        </>}/>
        <div style={{marginBottom:12,display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <input className="inp" style={{width:200}} placeholder="Search leads..." value={search} onChange={e=>setSearch(e.target.value)}/>
          <select className="inp" style={{width:180}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}><option>All</option>{STATUSES.map(s=><option key={s}>{s}</option>)}</select>
          <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
            <div className="pg" style={{width:120}}><div className="pgf" style={{width:(leads.filter(l=>l.status!=='Not called').length/leads.length)*100+'%',background:`linear-gradient(90deg,${G}88,${G})`}}/></div>
            <span style={{color:DIM,fontSize:10}}>{leads.filter(l=>l.status!=='Not called').length}/{leads.length} called</span>
          </div>
        </div>
        <div className="card" style={{padding:0,overflow:'hidden',marginBottom:12}}>
          <div style={{overflowX:'auto'}}>
            <table className="tbl">
              <thead><tr>{['#','BUSINESS','PHONE','STATUS','CALLBACK','NOTES'].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>{filtered.map(l=>{const cb=cbColor(l.callbackDate);return <tr key={l.id} style={{cursor:'pointer'}} onClick={()=>{const ld=leads.find(x=>x.id===l.id);setLf({num:String(l.id),status:ld.status,notes:ld.notes,callbackDate:ld.callbackDate||''});}}>
                <td style={{color:DIM,fontSize:10,width:28}}>{l.id}</td>
                <td style={{color:'#c8e0cc',fontWeight:700,whiteSpace:'nowrap',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis'}}>{l.name}</td>
                <td style={{color:DIM,whiteSpace:'nowrap',fontSize:10}}>{l.phone}</td>
                <td><span className="sb" style={sBadge(l.status)}>{l.status}</span></td>
                <td>{l.callbackDate?<span style={{color:cb,fontSize:10,fontWeight:700}} className={l.callbackDate===todayStr()?'cb-today':''}>{l.callbackDate===todayStr()?'TODAY':l.callbackDate<todayStr()?'⚠ '+l.callbackDate:l.callbackDate}</span>:<span style={{color:DIM,fontSize:10}}>—</span>}</td>
                <td style={{color:DIM,fontSize:10,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.notes||'—'}</td>
              </tr>;})}
              </tbody>
            </table>
          </div>
        </div>
        <div className="card">
          <div style={{fontWeight:700,color:'#c8e0cc',fontSize:12,marginBottom:12}}>Update Lead #{lf.num}{leads.find(l=>l.id===parseInt(lf.num))?' — '+leads.find(l=>l.id===parseInt(lf.num))?.name:''}</div>
          <div style={{display:'grid',gridTemplateColumns:'80px 160px 1fr auto',gap:10,alignItems:'flex-end',marginBottom:10}}>
            <div><span className="lbl">Lead #</span><input className="inp" value={lf.num} onChange={e=>{const l=leads.find(x=>x.id===parseInt(e.target.value));setLf({num:e.target.value,status:l?.status||'Not called',notes:l?.notes||'',callbackDate:l?.callbackDate||''});}} inputMode="numeric"/></div>
            <div><span className="lbl">Status</span><select className="inp" value={lf.status} onChange={e=>setLf({...lf,status:e.target.value})}>{STATUSES.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
            <div><span className="lbl">Notes</span><input className="inp" value={lf.notes} onChange={e=>setLf({...lf,notes:e.target.value})} placeholder="Decision maker, best time to call..."/></div>
            <button className="btn" onClick={saveLead}>Save</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'180px 1fr',gap:10,alignItems:'center'}}>
            <div><span className="lbl">Callback Date</span><input className="inp" type="date" value={lf.callbackDate} onChange={e=>setLf({...lf,callbackDate:e.target.value})} style={{colorScheme:'dark'}}/></div>
            {lf.callbackDate&&<div style={{color:cbColor(lf.callbackDate),fontSize:11,fontWeight:700}}>{lf.callbackDate<todayStr()?'⚠ OVERDUE':lf.callbackDate===todayStr()?'📞 Call today':'Set for '+lf.callbackDate}</div>}
          </div>
        </div>
      </div>}

      {/* LOGBOOK */}
      {sec==='logbook'&&<div className="section" ref={refs.logbook}>
        <SH t="Load Logbook" right={<>
          {[{l:'Loads',v:log.length},{l:'Total Gross',v:'$'+log.reduce((s,e)=>s+(e.pay||0),0).toLocaleString()},{l:'Avg RPM',v:avgRpm>0?'$'+avgRpm.toFixed(2):'—'}].map(({l,v})=><div key={l} style={{textAlign:'right'}}><div style={{color:DIM,fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>{l}</div><div style={{color:G,fontWeight:700,fontSize:13}}>{v}</div></div>)}
        </>}/>
        <div style={{marginBottom:12}}><button className={addLog?'btn-g':'btn'} style={{background:addLog?'rgba(57,255,107,.06)':undefined}} onClick={()=>setAddLog(!addLog)}>{addLog?'✕ Close':'+ Log New Load'}</button></div>
        {addLog&&<div className="card" style={{marginBottom:12}}>
          <div style={{fontWeight:700,color:'#c8e0cc',fontSize:12,marginBottom:12}}>New Load Entry</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:10}}>
            {[{l:'Date',k:'date',t:'date'},{l:'Pickup City',k:'pickup'},{l:'Dropoff City',k:'dropoff'},{l:'Loaded Miles',k:'miles',t:'number'},{l:'Deadhead',k:'dh',t:'number'},{l:'Rate/Mile',k:'rpm',t:'number'},{l:'Total Pay',k:'pay',t:'number'},{l:'Fuel Cost',k:'fuel',t:'number'}].map(({l,k,t})=><div key={k}><span className="lbl">{l}</span><input className="inp" type={t||'text'} value={logF[k]} onChange={e=>setLogF({...logF,[k]:e.target.value})} inputMode={t==='number'?'decimal':undefined}/></div>)}
          </div>
          <div style={{marginBottom:12}}><span className="lbl">Comments</span><textarea className="inp" style={{height:52,resize:'vertical'}} value={logF.comments} onChange={e=>setLogF({...logF,comments:e.target.value})} placeholder="Broker, load#, detention, notes..."/></div>
          <button className="btn" onClick={doAddLog}>Add to Logbook</button>
        </div>}
        {log.length>0&&<div className="card" style={{padding:0,overflow:'hidden',marginBottom:12}}>
          <div style={{overflowX:'auto'}}>
            <table className="tbl">
              <thead><tr>{['DATE','PICKUP','DROPOFF','LOADED','DH','$/MI','GROSS','FUEL','NET','NET RPM',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>{log.map(e=>{const tot=(e.miles||0)+(e.dh||0);const ai=tot>0?(e.pay||0)/tot:0;const nr=tot>0?((e.pay||0)-(e.fuel||0))/tot:0;const np=(e.pay||0)-(e.fuel||0);
                return <tr key={e.id} className={route?.id===e.id?'sel':''} onClick={()=>setRoute(e)} style={{cursor:'pointer'}}>
                  <td style={{color:DIM,whiteSpace:'nowrap',fontSize:10}}>{e.date}</td>
                  <td style={{whiteSpace:'nowrap'}}>{e.pickup}</td><td style={{whiteSpace:'nowrap'}}>{e.dropoff}</td>
                  <td>{e.miles}mi</td><td style={{color:DIM}}>{e.dh}mi</td>
                  <td style={{color:rC(ai),fontWeight:700}}>${ai.toFixed(2)}</td>
                  <td style={{color:G,fontWeight:700}}>${e.pay}</td><td style={{color:'#f87171'}}>${e.fuel}</td>
                  <td style={{color:np>=0?G:'#f87171',fontWeight:700}}>${np}</td>
                  <td><span style={{color:rC(nr),fontWeight:700}}>${nr.toFixed(2)}</span><span style={{color:DIM,fontSize:9}}>/mi</span></td>
                  <td><button className="btn-danger" onClick={ev=>{ev.stopPropagation();delLog(e.id);}}>Del</button></td>
                </tr>;
              })}</tbody>
            </table>
          </div>
        </div>}
        <div className="g11">
          <div className="card">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <button className="btn-g" style={{padding:'5px 11px'}} onClick={()=>setCal(cm===0?{y:cy-1,m:11}:{y:cy,m:cm-1})}>←</button>
              <span style={{color:G,fontWeight:700,fontSize:13}}>{MONTHS[cm]} {cy}</span>
              <button className="btn-g" style={{padding:'5px 11px'}} onClick={()=>setCal(cm===11?{y:cy+1,m:0}:{y:cy,m:cm+1})}>→</button>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:4}}>{DAYS.map(d=><div key={d} style={{color:DIM,fontSize:9,textAlign:'center',paddingBottom:5,fontWeight:700}}>{d}</div>)}</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
              {Array(fd).fill(null).map((_,i)=><div key={'e'+i}/>)}
              {Array(dim).fill(null).map((_,i)=>{const d=i+1,dl=dLogs(d),isT=d===nowD.getDate()&&cm===nowD.getMonth()&&cy===nowD.getFullYear();
                return <div key={d} className="cdv" style={{border:isT?'1px solid rgba(57,255,107,.6)':`1px solid ${dl.length?BD:'transparent'}`,background:dl.length?'rgba(57,255,107,.04)':'transparent',boxShadow:isT?'0 0 12px rgba(57,255,107,.2)':'none'}}>
                  <div style={{color:isT?G:DIM,fontSize:9,marginBottom:1,fontWeight:isT?700:400}}>{d}</div>
                  {dl.slice(0,1).map(e=><div key={e.id} style={{color:'#4ade80',fontSize:7,lineHeight:1.3}}>{e.pickup?.split(',')[0]}→{e.dropoff?.split(',')[0]}<br/><span style={{color:G,fontWeight:700}}>${e.pay}</span></div>)}
                </div>;
              })}
            </div>
          </div>
          <div className="card">
            <div style={{fontWeight:700,color:'#c8e0cc',fontSize:12,marginBottom:10}}>Route Map — Southeast US</div>
            {route?(()=>{
              const pc2=pCoords(route.pickup);const dc=pCoords(route.dropoff);
              const [px,py]=pc2?toXY(...pc2):[80,140];
              const [dx,dy]=dc?toXY(...dc):[240,55];
              const hasReal=pc2&&dc;
              return <>
                <div style={{borderRadius:8,overflow:'hidden',marginBottom:10,background:'#030806',border:'1px solid #1c3822'}}>
                  <svg width="100%" viewBox="0 0 340 210" style={{display:'block'}}>
                    {[42,84,126,168].map(y=><line key={'y'+y} x1={0} y1={y} x2={340} y2={y} stroke="#1a3520" strokeWidth=".5"/>)}
                    {[68,136,204,272].map(x=><line key={'x'+x} x1={x} y1={0} x2={x} y2={210} stroke="#1a3520" strokeWidth=".5"/>)}
                    {BG_CITIES.map(([name,lat,lng])=>{const [bx,by]=toXY(lat,lng);return <g key={name}><circle cx={bx} cy={by} r={2} fill="#1c3822"/><text x={bx} y={by-4} textAnchor="middle" fill="#2a4530" fontSize="6.5" fontFamily="monospace">{name}</text></g>;})}
                    <line x1={px} y1={py} x2={dx} y2={dy} stroke="rgba(251,191,36,.08)" strokeWidth={12} strokeLinecap="round"/>
                    <line x1={px} y1={py} x2={dx} y2={dy} stroke="#fbbf24" strokeWidth={2} strokeDasharray="7,4" opacity=".9"/>
                    <circle cx={px} cy={py} r={11} fill="rgba(57,255,107,.08)"/>
                    <circle cx={px} cy={py} r={7} fill={G}/><circle cx={px} cy={py} r={3} fill="#030806"/>
                    <circle cx={dx} cy={dy} r={11} fill="rgba(251,191,36,.08)"/>
                    <circle cx={dx} cy={dy} r={7} fill="#fbbf24"/><circle cx={dx} cy={dy} r={3} fill="#030806"/>
                    <text x={px} y={py+(py>dy?18:-10)} textAnchor="middle" fill={G} fontSize="8" fontFamily="monospace" fontWeight="700">↑ {route.pickup}</text>
                    <text x={dx} y={dy+(py>dy?-10:18)} textAnchor="middle" fill="#fbbf24" fontSize="8" fontFamily="monospace" fontWeight="700">{route.dropoff} ↓</text>
                    {!hasReal&&<text x={170} y={205} textAnchor="middle" fill="#2a4530" fontSize="6.5" fontFamily="monospace">Use "City, ST" format for real coords</text>}
                  </svg>
                </div>
                <div className="g3">
                  {[{l:'Total Miles',v:(route.miles||0)+(route.dh||0)+'mi',s:route.miles+' loaded · '+route.dh+' DH'},{l:'Gross Pay',v:'$'+(route.pay||0),s:'⛽ $'+(route.fuel||0)+' fuel',c:G},{l:'Net RPM',v:'$'+(((route.pay||0)-(route.fuel||0))/Math.max(1,(route.miles||0)+(route.dh||0))).toFixed(2),s:'net per all miles',c:rC(((route.pay||0)-(route.fuel||0))/Math.max(1,(route.miles||0)+(route.dh||0)))}].map(({l,v,s,c})=><div key={l} className="stat"><div style={{color:MUT,fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',marginBottom:2}}>{l}</div><div style={{color:c||'#dceede',fontWeight:700,fontSize:13}}>{v}</div><div style={{color:DIM,fontSize:9,marginTop:2}}>{s}</div></div>)}
                </div>
              </>;
            })():<div style={{color:DIM,textAlign:'center',padding:40,fontSize:11}}>Click a logbook row to view its route.</div>}
          </div>
        </div>
      </div>}

      {/* MAINTENANCE */}
      {sec==='maintenance'&&<div className="section" ref={refs.maintenance}>
        <SH t="Maintenance Log" right={<>
          {maintLog.length>0&&<span style={{color:DIM,fontSize:11}}>Total spent: <span style={{color:'#f87171',fontWeight:700}}>${maintLog.reduce((s,e)=>s+(e.cost||0),0).toLocaleString()}</span></span>}
          <button className={addMaint?'btn-g':'btn'} style={{fontSize:11,padding:'7px 14px',background:addMaint?'rgba(57,255,107,.06)':undefined,boxShadow:addMaint?'none':undefined}} onClick={()=>setAddMaint(!addMaint)}>{addMaint?'✕ Cancel':'+ Log Service'}</button>
        </>}/>
        {addMaint&&<div className="card" style={{marginBottom:12}}>
          <div style={{fontWeight:700,color:'#c8e0cc',fontSize:12,marginBottom:12}}>New Maintenance Entry</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:10}}>
            <div><span className="lbl">Date</span><input className="inp" type="date" value={maintF.date} onChange={e=>setMaintF({...maintF,date:e.target.value})} style={{colorScheme:'dark'}}/></div>
            <div><span className="lbl">Service Type</span><select className="inp" value={maintF.type} onChange={e=>setMaintF({...maintF,type:e.target.value})}>{MAINT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
            <div><span className="lbl">Odometer (mi)</span><input className="inp" value={maintF.mileage} onChange={e=>setMaintF({...maintF,mileage:e.target.value})} inputMode="numeric" placeholder="180,000"/></div>
            <div><span className="lbl">Cost ($)</span><input className="inp" value={maintF.cost} onChange={e=>setMaintF({...maintF,cost:e.target.value})} inputMode="decimal" placeholder="0.00"/></div>
          </div>
          <div style={{marginBottom:12}}><span className="lbl">Notes / Next Service Due</span><input className="inp" value={maintF.notes} onChange={e=>setMaintF({...maintF,notes:e.target.value})} placeholder="Next oil change at 185,000 mi · parts used..."/></div>
          <button className="btn" onClick={doAddMaint}>Save Entry</button>
        </div>}
        {maintLog.length>0?<div className="card" style={{padding:0,overflow:'hidden'}}>
          <table className="tbl">
            <thead><tr>{['DATE','SERVICE TYPE','ODOMETER','COST','NOTES',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{maintLog.map(e=><tr key={e.id}><td style={{color:DIM,fontSize:10}}>{e.date}</td><td style={{color:'#c8e0cc',fontWeight:700}}>{e.type}</td><td>{(e.mileage||0).toLocaleString()}mi</td><td style={{color:'#f87171',fontWeight:700}}>${e.cost||0}</td><td style={{color:DIM,maxWidth:180,fontSize:10}}>{e.notes}</td><td><button className="btn-danger" onClick={()=>delMaint(e.id)}>Del</button></td></tr>)}
            </tbody>
          </table>
        </div>:<div style={{color:DIM,fontSize:12,padding:'20px 0',textAlign:'center'}}>No maintenance entries yet.</div>}
        <div style={{height:24}}/>
      </div>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
